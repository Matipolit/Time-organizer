name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VPS_USER: ubuntu
  REPO_PATH: /home/ubuntu/programs/Time-organizer
  FRONTEND_DEPLOY_PATH: /var/www/html/timely
  SYSTEMD_SERVICE: time-organizer.service

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-backend:
    name: Build Backend (Rust Extension)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/markdown-render/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/markdown-render/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          # Only build for Python 3.12 to match the VPS, significantly reducing build time
          args: --release --out dist -i python3.12
          working-directory: backend/markdown-render
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: backend-wheels
          path: backend/markdown-render/dist/*.whl
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Download backend wheels
        uses: actions/download-artifact@v4
        with:
          name: backend-wheels
          path: backend-wheels

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          # Upload the wheel first
          scp -i ~/.ssh/deploy_key backend-wheels/*.whl ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "==> Pulling latest code..."
            cd ${{ env.REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main

            echo "==> Updating backend dependencies..."
            cd backend
            source .venv/bin/activate
            pip install -q -r requirements.txt

            echo "==> Detecting Python version and installing matching wheel..."
            # Extract major.minor (e.g., 3.12 -> 312)
            PY_VER=$(python3 -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')

            # Find and install the matching wheel
            WHEEL=$(ls /tmp/markdown_render*-cp${PY_VER}-*.whl | head -n 1)
            if [ -f "$WHEEL" ]; then
                pip install -q --force-reinstall "$WHEEL"
                echo "Successfully installed: $WHEEL"
            else
                echo "Error: No matching wheel found for Python $PY_VER in /tmp/"
                ls /tmp/markdown_render*.whl
                exit 1
            fi
            rm /tmp/markdown_render*.whl
            echo "==> Restarting backend service..."
            sudo systemctl restart ${{ env.SYSTEMD_SERVICE }}

            echo "==> Checking service status..."
            sleep 2
            if ! sudo systemctl is-active --quiet ${{ env.SYSTEMD_SERVICE }}; then
                echo "Service failed to start! Recent logs:"
                sudo journalctl -u ${{ env.SYSTEMD_SERVICE }} -n 20 --no-pager
                exit 1
            fi
            echo "Service is running!"
          EOF

      - name: Deploy frontend
        run: |
          echo "==> Uploading frontend build..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ \
            ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.FRONTEND_DEPLOY_PATH }}/

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "==> Frontend files:"
            ls -la ${{ env.FRONTEND_DEPLOY_PATH }}

            echo ""
            echo "==> Backend service status:"
            sudo systemctl status ${{ env.SYSTEMD_SERVICE }} --no-pager -l
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
