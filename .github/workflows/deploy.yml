name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VPS_USER: ubuntu
  REPO_PATH: /home/ubuntu/programs/Time-organizer
  FRONTEND_DEPLOY_PATH: /var/www/html/timely
  SYSTEMD_SERVICE: time-organizer.service

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "==> Pulling latest code..."
            cd ${{ env.REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main

            echo "==> Updating backend dependencies..."
            cd backend
            source .venv/bin/activate
            pip install -q -r requirements.txt

            echo "==> Restarting backend service..."
            sudo systemctl restart ${{ env.SYSTEMD_SERVICE }}

            echo "==> Checking service status..."
            sleep 2
            sudo systemctl is-active --quiet ${{ env.SYSTEMD_SERVICE }} && echo "Service is running!" || (echo "Service failed to start!" && exit 1)
          EOF

      - name: Deploy frontend
        run: |
          echo "==> Uploading frontend build..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ \
            ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.FRONTEND_DEPLOY_PATH }}/

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "==> Frontend files:"
            ls -la ${{ env.FRONTEND_DEPLOY_PATH }}

            echo ""
            echo "==> Backend service status:"
            sudo systemctl status ${{ env.SYSTEMD_SERVICE }} --no-pager -l
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
